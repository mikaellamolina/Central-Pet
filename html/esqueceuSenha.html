<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <title>Central Pet - Recuperar Senha</title>
</head>
<body class="forgot-password-page">

  <!-- Cabeçalho (Barra Laranja Superior) -->
  <header class="topbar">
    <div class="brand-container">
      <a href="index.html" class="brand-link">
        <img src="logo-centralpet.png" alt="Logo Central Pet" class="brand-logo">
        <span class="brand-title">Central <span class="brand-highlight">Pet</span></span>
      </a>
    </div>
  </header>

  <!-- Área Principal (Fundo de Patinhas) -->
  <main class="forgot-password-main">

    <h1 class="page-title">Recuperar Senha</h1>

    <!-- Card/Painel Centralizado -->
    <div class="forgot-password-card">
      <p class="card-description">
        Digite o e-mail associado à sua conta para receber o link de redefinição.
      </p>

      <form action="/api/solicitar-recuperacao" method="POST" autocomplete="off" class="forgot-password-form">
        
        <!-- Token CSRF -->
        <input type="hidden" name="csrf_token" value="SEU_TOKEN_CSRF_GERADO_PELO_SERVER">

        <!-- Campo E-mail -->
        <div class="form-group">
          <label for="user-email" class="form-label">E-mail cadastrado:</label>
          <input 
            type="email" 
            id="user-email" 
            name="email" 
            class="form-input" 
            placeholder="Digite seu e-mail" 
            required 
            maxlength="254" 
            pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$"
          >
        </div>

        <!-- Botão de Envio (Vermelho) -->
        <div class="form-actions">
          <button type="submit" id="confirmarRecuperacao" class="btn-primary">Enviar Link de Redefinição</button>
        </div>

        <!-- Link de Voltar ao Login -->
        <div class="form-footer-link">
          <a href="login.html" class="back-link" rel="noopener">← Voltar para a tela de Login</a>
        </div>

      </form>
    </div>

  </main>

  <!-- Rodapé (Faixa Azul Escura Inferior) -->
  <footer class="footer-bar">
    <div class="footer-container">
      <p>&copy; Central Pet - Todos os direitos reservados.</p>
    </div>
  </footer>

</body>
</html>
